<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | The Flavorverse</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(77, 53, 71, 0.35),
                    rgba(77, 53, 71, 0.35)
                ),
                url("login.png") center center / cover no-repeat fixed;

            display: flex;
            flex-direction: column;
        }

        /* NAVBAR */

        nav {
            height: 75px;

            background: #735267;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;

            color: white;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        nav a {
            color: white;
            text-decoration: none;

            margin-left: 25px;

            font-size: 15px;

            transition: 0.3s;
        }

        nav a:hover {
            opacity: 0.75;
        }

        /* MAIN */

        .main {
            flex: 1;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 50px 20px;
        }

        /* GLASS CARD */

        .register-card {
            width: 420px;

            padding: 40px;

            background: rgba(255, 255, 255, 0.20);

            border: 1px solid rgba(255, 255, 255, 0.45);

            border-radius: 25px;

            box-shadow:
                0 20px 50px rgba(40, 20, 35, 0.30),
                inset 0 1px 1px rgba(255, 255, 255, 0.35);

            backdrop-filter: blur(16px);

            -webkit-backdrop-filter: blur(16px);
        }

        .register-card h1 {
            text-align: center;

            color: #ffffff;

            margin-bottom: 8px;

            text-shadow:
                0 2px 8px rgba(50, 30, 45, 0.4);
        }

        .register-card .subtitle {
            text-align: center;

            color: #fff8ef;

            margin-bottom: 30px;

            font-size: 14px;

            text-shadow:
                0 1px 5px rgba(50, 30, 45, 0.35);
        }

        .input-box {
            margin-bottom: 18px;
        }

        .input-box label {
            display: block;

            margin-bottom: 7px;

            color: white;

            font-weight: bold;

            font-size: 14px;

            text-shadow:
                0 1px 4px rgba(50, 30, 45, 0.4);
        }

        .input-box input {
            width: 100%;

            padding: 13px 15px;

            border: 1px solid rgba(255, 255, 255, 0.55);

            border-radius: 12px;

            outline: none;

            background: rgba(255, 255, 255, 0.65);

            font-size: 14px;

            color: #4d3547;

            transition: 0.3s;
        }

        .input-box input::placeholder {
            color: #735267;
        }

        .input-box input:focus {
            border-color: white;

            background: rgba(255, 255, 255, 0.82);

            box-shadow:
                0 0 0 3px rgba(255, 255, 255, 0.18);
        }

        /* REGISTER BUTTON */

        .register-btn {
            width: 100%;

            padding: 14px;

            margin-top: 8px;

            border: 1px solid rgba(255, 255, 255, 0.35);

            border-radius: 13px;

            background: #735267;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .register-btn:hover {
            background: #4d3547;

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(50, 30, 45, 0.25);
        }

        /* LOGIN TEXT */

        .login-text {
            text-align: center;

            margin-top: 22px;

            color: white;

            font-size: 14px;

            text-shadow:
                0 1px 4px rgba(50, 30, 45, 0.4);
        }

        .login-text a {
            color: #fff0cf;

            font-weight: bold;

            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        /* FOOTER */

        footer {
            background: #4d3547;

            color: #f4e5c5;

            text-align: center;

            padding: 18px;

            font-size: 13px;
        }

        /* MOBILE */

        @media(max-width: 500px) {

            .register-card {
                width: 100%;

                padding: 30px 22px;
            }

            nav {
                padding: 0 20px;
            }

            nav a {
                margin-left: 10px;
            }

        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav>

        <div class="logo">
            The Flavorverse 🍽️
        </div>

        <div>

            <!-- HOME -->

            <a href="index.html">
                Home
            </a>


            <!-- LOGIN -->

            <!-- IMPORTANT:
                 Login must open login.html
            -->

            <a href="login.html">
                Login
            </a>

        </div>

    </nav>


    <!-- ================= REGISTER ================= -->

    <div class="main">

        <div class="register-card">

            <h1>
                Create Account ✨
            </h1>

            <p class="subtitle">
                Join The Flavorverse and explore delicious worlds!
            </p>


            <!-- FULL NAME -->

            <div class="input-box">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                >

            </div>


            <!-- EMAIL -->

            <div class="input-box">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-box">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                >

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="input-box">

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                >

            </div>


            <!-- CREATE ACCOUNT -->

            <button
                class="register-btn"
                onclick="registerUser()"
            >
                Create Account
            </button>


            <!-- ALREADY HAVE ACCOUNT -->

            <p class="login-text">

                Already have an account?

                <!-- IMPORTANT:
                     This must open login.html
                -->

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <!-- ================= FOOTER ================= -->

    <footer>

        © 2026 The Flavorverse · Taste. Explore. Discover. 🍴

    </footer>


    <!-- ================= FIREBASE ================= -->

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


    <script>

        /* ================= FIREBASE CONFIG ================= */

        const firebaseConfig = {

            apiKey: "AIzaSyD0dsVFReTfNXJamLKcGMBGWQYrM0DgYSg",

            authDomain: "the-flavoverse.firebaseapp.com",

            projectId: "the-flavoverse",

            storageBucket: "the-flavoverse.firebasestorage.app",

            messagingSenderId: "1064022248292",

            appId: "1:1064022248292:web:b2084d0ee1b4722d8bc871"

        };


        firebase.initializeApp(firebaseConfig);


        const auth = firebase.auth();

        const db = firebase.firestore();


        /* ================= REGISTER USER ================= */

        async function registerUser() {

            const name =
                document.getElementById("name").value.trim();


            const email =
                document.getElementById("email").value.trim();


            const password =
                document.getElementById("password").value;


            const confirmPassword =
                document.getElementById("confirmPassword").value;


            /* EMPTY FIELD CHECK */

            if (
                !name ||
                !email ||
                !password ||
                !confirmPassword
            ) {

                alert(
                    "Please fill all fields."
                );

                return;
            }


            /* PASSWORD MATCH CHECK */

            if (password !== confirmPassword) {

                alert(
                    "Passwords do not match."
                );

                return;
            }


            /* PASSWORD LENGTH CHECK */

            if (password.length < 6) {

                alert(
                    "Password must be at least 6 characters."
                );

                return;
            }


            try {

                /* CREATE FIREBASE ACCOUNT */

                const userCredential =
                    await auth.createUserWithEmailAndPassword(
                        email,
                        password
                    );


                const user =
                    userCredential.user;


                /* SAVE USER DETAILS */

                await db
                    .collection("users")
                    .doc(user.uid)
                    .set({

                        name: name,

                        email: user.email,

                        uid: user.uid,

                        createdAt:
                            firebase.firestore.FieldValue.serverTimestamp()

                    });


                /* SUCCESS */

                alert(
                    "Account created successfully! 🎉"
                );


                /*
                    NEW ACCOUNT
                    ↓
                    INDEX PAGE
                */

                window.location.href =
                    "index.html";

            }


            catch (error) {

                console.error(error);


                if (
                    error.code ===
                    "auth/email-already-in-use"
                ) {

                    alert(
                        "This email is already registered. Please login."
                    );

                }


                else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    alert(
                        "Please enter a valid email address."
                    );

                }


                else if (
                    error.code ===
                    "auth/weak-password"
                ) {

                    alert(
                        "Password is too weak. Use at least 6 characters."
                    );

                }


                else {

                    alert(
                        "Registration failed: " +
                        error.message
                    );

                }

            }

        }

    </script>


</body>

</html>
